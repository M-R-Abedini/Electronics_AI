[package]
name = "placer-core"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "Electronics AI placement core (geometry, cost, legalization, annealing)"
publish = false

[lib]
name = "placer_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.27", features = ["extension-module", "abi3-py312"] }
rand = { version = "0.9", default-features = false, features = ["std"] }
rand_chacha = "0.9"

[dev-dependencies]
proptest = "1"

[profile.release]
lto = "thin"
codegen-units = 1
