version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "ci"
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "deps"
  - package-ecosystem: "pip"
    directory: "/eda-agent"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "deps"
  - package-ecosystem: "cargo"
    directory: "/crates/placer-core"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "deps"
