name: Suite tests
# Pull requests are the merge path (branch ruleset on main), so branch
# pushes do not need their own run: the former push+pull_request pair
# executed the whole suite twice per pull request. Pushes to main still
# run to verify every merge, and workflow_dispatch stays manual.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
# A new push to a pull request supersedes its previous run; cancel the
# stale one instead of queueing behind it. Main runs are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  # The suites used to run sequentially inside one job per OS, so wall
  # time was the sum of every suite. They are independent, so they now
  # run as parallel jobs; wall time is the slowest single job. The
  # "python" gate job at the bottom preserves the historical required
  # check names for the branch ruleset.
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            constraints-windows-py312.txt
            eda-agent/pyproject.toml
      - run: python -m pip install -r requirements.txt
      - name: Lint and build native script bundle used by regression tests
        run: python eda-agent/scripts/altium/build.py
      - name: Offline stdio startup without an Altium installation
        run: python tests/smoke_stdio.py
      - name: Native gateway catalog and all library contracts without external executables
        run: python tests/smoke_suite_stdio.py --toolset full
  root:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            constraints-windows-py312.txt
            eda-agent/pyproject.toml
      - run: python -m pip install -r requirements.txt
      - name: Cache Rust toolchain and placer-core build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.rustup
            crates/placer-core/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('crates/placer-core/Cargo.lock', 'crates/placer-core/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Build Rust placement core used by the placer tests
        # crates/placer-core is a maturin (PyO3 abi3-py312) extension; the
        # hosted runners ship a Rust toolchain via rustup. Without this the
        # solver tests fail with ModuleNotFoundError instead of exercising
        # the Rust/Python parity they exist to verify.
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          python -m pip install ./crates/placer-core
      - name: Lint and build native script bundle used by regression tests
        run: python eda-agent/scripts/altium/build.py
      - name: Complete root regression suite, native codecs and package license closure
        run: python -m pytest tests -q
  eda:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            constraints-windows-py312.txt
            eda-agent/pyproject.toml
      - run: python -m pip install -r requirements.txt
      - name: Cache Rust toolchain and placer-core build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.rustup
            crates/placer-core/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('crates/placer-core/Cargo.lock', 'crates/placer-core/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Build Rust placement core used by the placer tests
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          python -m pip install ./crates/placer-core
      - name: Lint and build native script bundle used by regression tests
        run: python eda-agent/scripts/altium/build.py
      - name: Complete EDA regression suite
        run: python -m pytest tests -q
        working-directory: eda-agent
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            constraints-windows-py312.txt
            eda-agent/pyproject.toml
      - run: python -m pip install -r requirements.txt
      - name: Lint and build native script bundle used by regression tests
        run: python eda-agent/scripts/altium/build.py
      - name: Build and verify actual EDA wheel native project closure
        run: |
          python -m pip wheel --no-deps ./eda-agent --wheel-dir dist/wheels
          python scripts/build_plugin.py --check-wheel dist/wheels
      - name: Clean plugin package, reproducibility and isolated MCP startup
        run: python scripts/build_plugin.py --output dist --smoke --check-reproducible
  python:
    # Gate job. The branch ruleset requires the check names
    # "python (windows-latest)" and "python (ubuntu-latest)"; this job
    # keeps those exact names while the suites above run in parallel.
    # It runs even when a needed job fails (if: always) and then fails
    # itself unless every needed job succeeded, so a red suite still
    # blocks the merge exactly as before.
    needs: [smoke, root, eda, package]
    if: always()
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - name: Require every suite job to have succeeded
        shell: bash
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "Suite job results: $results"
          for result in $results; do
            if [ "$result" != "success" ]; then
              echo "A suite job did not succeed ($result); failing the gate."
              exit 1
            fi
          done
          echo "All suite jobs succeeded."
