[workspace]
name = "electronics-ai"
channels = ["conda-forge"]
platforms = ["win-64"]

[dependencies]
python = "3.12.*"
openjdk = "25.*"
pytest = "*"
ruff = "*"
rust = "*"
maturin = ">=1.9"
pip = "*"
numpy = ">=2"
shapely = ">=2"
scipy = ">=1.13"

[tasks]
java-version = "java -version"
py = { cmd = "python", env = { PYTHONPATH = "$PIXI_PROJECT_ROOT/eda-agent/src" } }
route-check = { cmd = "python -m eda_agent.placer.route", env = { PYTHONPATH = "$PIXI_PROJECT_ROOT/eda-agent/src" } }
test-placer = { cmd = "python -m pytest eda-agent/tests/placer -q -p no:cacheprovider --confcutdir=eda-agent/tests/placer --rootdir=eda-agent/tests/placer", env = { PYTHONPATH = "$PIXI_PROJECT_ROOT/eda-agent/src" } }
lint-placer = "ruff check eda-agent/src/eda_agent/placer eda-agent/tests/placer"
bench = { cmd = "python -m eda_agent.placer.bench", env = { PYTHONPATH = "$PIXI_PROJECT_ROOT/eda-agent/src" } }
placer-mcp = { cmd = "python -m eda_agent.placer.mcp", env = { PYTHONPATH = "$PIXI_PROJECT_ROOT/eda-agent/src" } }
macro-proof = { cmd = "python -m eda_agent.placer.macro_proof", env = { PYTHONPATH = "$PIXI_PROJECT_ROOT/eda-agent/src" } }
intent = { cmd = "python -m eda_agent.placer.intent", env = { PYTHONPATH = "$PIXI_PROJECT_ROOT/eda-agent/src" } }
calibrate = { cmd = "python -m eda_agent.placer.eval.calibrate", env = { PYTHONPATH = "$PIXI_PROJECT_ROOT/eda-agent/src" } }
cypress = { cmd = "python -m eda_agent.placer.cypress", env = { PYTHONPATH = "$PIXI_PROJECT_ROOT/eda-agent/src" } }
place = { cmd = "python -m eda_agent.placer.place", env = { PYTHONPATH = "$PIXI_PROJECT_ROOT/eda-agent/src" } }
roundtrip = { cmd = "python -m eda_agent.placer.io.roundtrip", env = { PYTHONPATH = "$PIXI_PROJECT_ROOT/eda-agent/src" } }
build-core = { cmd = "maturin develop --release", cwd = "crates/placer-core" }
test-core = { cmd = "cargo test --lib", cwd = "crates/placer-core" }

[pypi-dependencies]
eda-agent = { path = "eda-agent", editable = true }
